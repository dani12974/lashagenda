<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel — LashAgenda</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="topbar">
  <a href="dashboard.html" class="brand">
    <svg viewBox="0 0 26 26"><path class="lash-curve" d="M3 18 Q13 4 23 18" /></svg>
    LashAgenda
  </a>
  <button id="btn-sair" style="background:none; border:none; font-size:0.85rem; font-weight:600; color:var(--ink-soft); cursor:pointer;">Sair</button>
</div>

<div class="shell-wide">
  <h1 id="biz-name">Painel</h1>

  <div class="card" style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:24px;">
    <div style="font-size:0.85rem;">
      <strong>Sua agenda pública:</strong><br />
      <span id="public-link" style="color:var(--rose-dark);"></span>
    </div>
    <button id="btn-copiar" class="btn btn-ghost" style="width:auto; padding:10px 16px; margin:0;">Copiar link</button>
  </div>

  <div class="summary-grid">
    <div class="summary-card rose">
      Receita do mês
      <span class="num" id="num-receita">R$ 0</span>
    </div>
    <div class="summary-card">
      Despesas do mês
      <span class="num" id="num-despesa">R$ 0</span>
    </div>
  </div>

  <div style="display:flex; gap:10px; margin-bottom:24px; flex-wrap:wrap;">
    <a href="servicos.html" class="btn btn-ghost" style="width:auto; padding:10px 16px; margin:0;">Meus serviços</a>
    <a href="disponibilidade.html" class="btn btn-ghost" style="width:auto; padding:10px 16px; margin:0;">Meus horários</a>
  </div>

  <h2>Próximos agendamentos</h2>
  <div class="card" id="lista-agendamentos" style="margin-bottom:28px;"></div>

  <h2>Lançar no financeiro</h2>
  <div class="card" style="margin-bottom:28px;">
    <form id="form-transacao">
      <label for="tx-type">Tipo</label>
      <select id="tx-type">
        <option value="income">Entrada</option>
        <option value="expense">Saída (despesa)</option>
      </select>

      <label for="tx-amount">Valor (R$)</label>
      <input id="tx-amount" type="number" step="0.01" min="0" required placeholder="50.00" />

      <label for="tx-description">Descrição</label>
      <input id="tx-description" type="text" placeholder="Ex: cola, aluguel, venda de produto" />

      <label for="tx-payment">Forma de pagamento</label>
      <select id="tx-payment">
        <option value="pix">Pix</option>
        <option value="dinheiro">Dinheiro</option>
        <option value="cartao">Cartão</option>
      </select>

      <button type="submit" class="btn btn-primary">Lançar</button>
      <div class="alert alert-error" id="tx-error"></div>
    </form>
  </div>

  <h2>Últimos lançamentos</h2>
  <div class="card" id="lista-transacoes"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script>
let business = null;

async function init() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { window.location.href = "login.html"; return; }

  const { data: biz } = await sb.from("businesses").select("*").eq("owner_id", user.id).maybeSingle();
  if (!biz) { window.location.href = "onboarding.html"; return; }
  business = biz;
  setActiveBusiness(biz);

  document.getElementById("biz-name").textContent = biz.name;
  const url = `${window.location.origin}/agendar.html?l=${biz.slug}`;
  document.getElementById("public-link").textContent = url;

  document.getElementById("btn-copiar").addEventListener("click", () => {
    navigator.clipboard.writeText(url);
    const b = document.getElementById("btn-copiar");
    b.textContent = "Copiado!";
    setTimeout(() => b.textContent = "Copiar link", 1500);
  });

  await loadAppointments();
  await loadFinance();
}

async function loadAppointments() {
  const { data: appts } = await sb
    .from("appointments")
    .select("*, clients(name, phone), services(name)")
    .eq("business_id", business.id)
    .gte("start_time", new Date().toISOString())
    .neq("status", "canceled")
    .order("start_time", { ascending: true })
    .limit(20);

  const el = document.getElementById("lista-agendamentos");

  if (!appts || appts.length === 0) {
    el.innerHTML = `<div class="empty-state">Nenhum agendamento futuro ainda. Compartilhe seu link com as clientes!</div>`;
    return;
  }

  el.innerHTML = appts.map(a => {
    const dt = new Date(a.start_time);
    const dateLabel = dt.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
    const timeLabel = dt.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    const depositBadge = a.deposit_status === "paid"
      ? `<span class="badge badge-paid">Sinal pago</span>`
      : `<span class="badge badge-pending">Sinal pendente</span>`;

    const phone = (a.clients?.phone || "").replace(/\D/g, "");
    const waMsg = encodeURIComponent(
      `Oi ${a.clients?.name || ""}! Confirmando seu agendamento de ${a.services?.name || ""} no dia ${dateLabel} às ${timeLabel}. ` +
      `O sinal é de ${formatBRL(a.deposit_amount)}${business.pix_key ? `, chave Pix: ${business.pix_key}` : ""}. Pode confirmar pra eu garantir seu horário? 💕`
    );

    return `
      <div class="appt-row">
        <div class="appt-time">${dateLabel}<br /><span style="font-weight:500; font-size:0.8rem;">${timeLabel}</span></div>
        <div style="flex:1; padding:0 12px;">
          <strong style="display:block; color:var(--ink);">${a.clients?.name || "Cliente"}</strong>
          <span style="font-size:0.82rem; color:var(--ink-soft);">${a.services?.name || ""}</span><br />
          ${depositBadge}
        </div>
        <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
          ${phone ? `<a href="https://wa.me/55${phone}?text=${waMsg}" target="_blank" class="btn-ghost" style="width:auto; padding:6px 10px; font-size:0.75rem; border-radius:6px; text-decoration:none;">Lembrar sinal</a>` : ""}
          ${a.status !== "completed" ? `<button class="btn-ghost btn-concluir" data-id="${a.id}" data-value="${a.value}" style="width:auto; padding:6px 10px; font-size:0.75rem; border-radius:6px;">Concluir</button>` : `<span style="font-size:0.75rem; color:var(--success);">Concluído</span>`}
        </div>
      </div>
    `;
  }).join("");

  el.querySelectorAll(".btn-concluir").forEach(btn => {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.textContent = "...";
      const id = btn.dataset.id;
      const value = Number(btn.dataset.value);

      await sb.from("appointments").update({ status: "completed" }).eq("id", id);
      await sb.from("transactions").insert({
        business_id: business.id,
        appointment_id: id,
        type: "income",
        amount: value,
        payment_method: "pix",
        description: "Procedimento concluído"
      });

      await loadAppointments();
      await loadFinance();
    });
  });
}

async function loadFinance() {
  const now = new Date();
  const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);

  const { data: txs } = await sb
    .from("transactions")
    .select("*")
    .eq("business_id", business.id)
    .gte("transaction_date", firstDay)
    .order("transaction_date", { ascending: false });

  const income = (txs || []).filter(t => t.type === "income").reduce((s,t) => s + Number(t.amount), 0);
  const expense = (txs || []).filter(t => t.type === "expense").reduce((s,t) => s + Number(t.amount), 0);

  document.getElementById("num-receita").textContent = formatBRL(income);
  document.getElementById("num-despesa").textContent = formatBRL(expense);

  const el = document.getElementById("lista-transacoes");
  if (!txs || txs.length === 0) {
    el.innerHTML = `<div class="empty-state">Nenhum lançamento este mês.</div>`;
    return;
  }

  el.innerHTML = txs.slice(0, 15).map(t => `
    <div class="appt-row">
      <div style="flex:1;">
        <strong style="color:var(--ink);">${t.description || (t.type === "income" ? "Entrada" : "Saída")}</strong><br />
        <span style="font-size:0.78rem; color:var(--ink-soft);">${new Date(t.transaction_date).toLocaleDateString("pt-BR")} · ${t.payment_method || ""}</span>
      </div>
      <div style="font-weight:700; color:${t.type === "income" ? "var(--success)" : "var(--error)"};">
        ${t.type === "income" ? "+" : "-"} ${formatBRL(t.amount)}
      </div>
    </div>
  `).join("");
}

document.getElementById("form-transacao").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("tx-error");
  errorBox.classList.remove("show");

  const payload = {
    business_id: business.id,
    type: document.getElementById("tx-type").value,
    amount: Number(document.getElementById("tx-amount").value),
    description: document.getElementById("tx-description").value.trim() || null,
    payment_method: document.getElementById("tx-payment").value
  };

  const { error } = await sb.from("transactions").insert(payload);

  if (error) {
    errorBox.textContent = "Erro ao lançar: " + error.message;
    errorBox.classList.add("show");
    return;
  }

  document.getElementById("form-transacao").reset();
  await loadFinance();
});

document.getElementById("btn-sair").addEventListener("click", async () => {
  await sb.auth.signOut();
  localStorage.removeItem("lashagenda_business");
  window.location.href = "index.html";
});

init();
</script>

</body>
</html>
